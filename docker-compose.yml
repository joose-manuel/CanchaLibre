services:
  postgres:
    image: postgres:16-alpine
    container_name: canchalibre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: canchalibre
      POSTGRES_USER: canchalibre
      POSTGRES_PASSWORD: canchalibre
    ports:
      - '5432:5432'
    volumes:
      - canchalibre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canchalibre -d canchalibre']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  canchalibre_pgdata:
