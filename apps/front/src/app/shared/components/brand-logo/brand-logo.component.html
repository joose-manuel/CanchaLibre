<div class="brand" [class.brand--intro]="intro()">
  <div class="brand__icon">
    <div class="brand__ball">
      <cl-ball [size]="ballSize()" [animation]="ballAnimation()" />
    </div>
  </div>

  @if (wordmark()) {
    <p class="brand__wordmark" aria-hidden="true">
      <span class="brand__word brand__word--main">Cancha</span><span
        class="brand__word brand__word--accent"
        >Libre</span
      >
    </p>
  }
</div>
