<div class="chips" role="group" aria-label="Filtrar por deporte">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="chip"
      [class.chip--active]="option.value === selected()"
      [attr.aria-pressed]="option.value === selected()"
      (click)="selectedChange.emit(option.value)"
    >
      @if (option.dotColor) {
        <span class="chip__dot" [style.background]="option.dotColor" aria-hidden="true"></span>
      }
      {{ option.label }}
    </button>
  }
</div>
