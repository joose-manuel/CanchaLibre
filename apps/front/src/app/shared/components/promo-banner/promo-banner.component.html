<button type="button" class="promo" (click)="pressed.emit()">
  <span class="promo__icon">
    <i [class]="icon()" aria-hidden="true"></i>
  </span>
  <span class="promo__text">
    <strong class="promo__title">{{ title() }}</strong>
    @if (subtitle()) {
      <span class="promo__subtitle">{{ subtitle() }}</span>
    }
  </span>
  <i class="pi pi-chevron-right promo__chevron" aria-hidden="true"></i>
</button>
