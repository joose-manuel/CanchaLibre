<header class="header">
  <div class="header__text">
    <p class="header__eyebrow">{{ dateLabel() }}</p>
    <h1 class="header__title">
      {{ greeting() }}, {{ user().firstName }}
    </h1>
  </div>

  <div class="header__actions">
    <cl-theme-toggle />

    <button
      type="button"
      class="header__create"
      aria-label="Crear partido"
      (click)="createPressed.emit()"
    >
      <i class="pi pi-plus" aria-hidden="true"></i>
    </button>

    <button type="button" class="header__avatar" (click)="avatarPressed.emit()" aria-label="Abrir perfil">
      @if (user().avatarSrc) {
        <img [src]="user().avatarSrc" alt="" />
      } @else {
        {{ user().firstName.charAt(0) }}
      }
      @if (user().online) {
        <span class="header__status" aria-hidden="true"></span>
      }
    </button>
  </div>
</header>
