<article class="match" [class]="'match match--' + match().sport">
  <span class="match__media">
    <img [src]="match().imageSrc" [alt]="match().venue" />
  </span>

  <div class="match__body">
    <h3 class="match__title">{{ match().venue }}</h3>

    <p class="match__where">
      <span class="match__sport">{{ match().sportLabel }}</span>
      <span class="match__sep" aria-hidden="true">·</span>
      <span>{{ match().address }}</span>
      @if (distanceLabel()) {
        <span class="match__sep" aria-hidden="true">·</span>
        <span>{{ distanceLabel() }}</span>
      }
    </p>

    <p class="match__meta">
      <span class="match__time">{{ match().startTime }}</span>
      <span class="match__sep" aria-hidden="true">·</span>
      <span>{{ match().joinedPlayers }} de {{ match().totalPlayers }} jugadores</span>
    </p>
  </div>

  <button
    type="button"
    class="match__cta"
    [disabled]="ctaDisabled()"
    (click)="join.emit(match())"
  >
    {{ ctaLabel() }}
  </button>
</article>
