<main class="login">
  <section class="login__card">
    <header class="login__header">
      <h1 class="login__title">Bienvenido a<br />CanchaLibre</h1>
      <p class="login__subtitle">Gestiona tus partidos y reservas fácilmente.</p>
    </header>

    <form class="login__form" (submit)="onSubmit($event)">
      <div class="login__field">
        <label class="login__label" for="login-email">Correo electrónico</label>
        <div class="login__control">
          <i class="pi pi-envelope login__icon" aria-hidden="true"></i>
          <input
            pInputText
            id="login-email"
            type="email"
            class="login__input"
            placeholder="tu@email.com"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="login__field">
        <div class="login__label-row">
          <label class="login__label" for="login-password">Contraseña</label>
          <a class="login__link" href="#">¿Olvidaste la clave?</a>
        </div>
        <div class="login__control">
          <i class="pi pi-lock login__icon" aria-hidden="true"></i>
          <input
            pInputText
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="login__input"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="login__eye"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <p-button type="submit" label="Iniciar Sesión" class="login__submit" />
    </form>

    <div class="login__divider"><span>O BIEN ENTRA CON</span></div>

    <div class="login__social">
      <cl-social-button [provider]="'google'" />
      <cl-social-button [provider]="'apple'" />
    </div>

    <p class="login__register">
      ¿No tienes cuenta? <a class="login__link login__link--strong" href="#">Regístrate</a>
    </p>
  </section>

  <p class="login__terms">
    Al continuar, aceptas nuestros <a href="#">Términos de Servicio</a> y
    <a href="#">Política de Privacidad</a>.
  </p>
</main>
